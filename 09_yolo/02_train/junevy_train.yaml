# 检测任务数据集配置（单个类别 junevy）
#
# 目录结构：
# bvn/
# ├── images/
# │   ├── train/  39 张
# │   └── val/     3 张
# └── labels/
#     ├── train/  39 个 .txt（YOLO 格式，由 convert_labelme_to_yolo.py 从 LabelMe json 转换）
#     └── val/     3 个 .txt

# 数据集根目录：使用绝对路径，避免相对路径被解析到 settings 的 datasets_dir
path: D:/Documents/DEV/Python/09_yolo/02_train/bvn

# 以下路径相对于 path
train: images/train
val: images/val

# 类别索引与名称，顺序即 class_id
names:
  0: junevy
